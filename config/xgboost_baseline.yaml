# XGBoost baseline - initial model settings only.
#
# These are a-priori starting values for the principal non-linear model
# candidate, not experimentally selected hyperparameters. Any change after
# development experiments must be justified in logs/DECISION_LOG.md. This
# file must never store experimental results, metrics or selected
# thresholds.
#
# scale_pos_weight: fixed at 1 for the first fair comparison against the
# Logistic Regression baseline; imbalance handling remains open for a
# later controlled experiment.
#
# tree_method: hist (CPU). GPU / CUDA parameters must not be set.
#
# n_jobs: -1 uses all available host CPU threads.

model:
  objective: binary:logistic
  eval_metric: aucpr
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0
  reg_alpha: 0
  reg_lambda: 1
  scale_pos_weight: 1
  tree_method: hist
  random_state: 42
  n_jobs: -1
  verbosity: 1
